<script>
document.title = 'Bike shed v2 — parts sheet';
bars('parts', 'PARTS SHEET');
const s = el('div', 'shell page');

s.appendChild(el('h1', 'steph', 'Parts sheet'));
s.appendChild(el('div', 'divlead', 'Every piece, drawn to scale on the 100 mm grid. Groups match the cutting-day labels written on the wood.'));

/* piece bar: length-true bar + end glyph */
function bar(len, sect, cls) {
  const w = Math.min(window.innerWidth - 130, 250), pad = 8;
  const sc = (w - 2 * pad) / Math.max(len, 2260);
  const bh = Math.max(9, Math.min(22, (sect ? sect[1] : 50) * sc * 8));
  const h = 34;
  const [c, x] = mkCanvas(w, h);
  x.save(); x.translate(pad, h / 2);
  // mini grid
  x.strokeStyle = PAL.gridMinor; x.lineWidth = 0.6;
  for (let g = 0; g <= len; g += 100) { x.beginPath(); x.moveTo(g * sc, -14); x.lineTo(g * sc, 14); x.stroke(); }
  x.fillStyle = cls === 'bat' ? '#f6f6f4' : '#ffffff';
  x.strokeStyle = PAL.ink; x.lineWidth = 1.8;
  const hh = Math.max(8, sect[1] * sc * (sect[1] === 22 ? 22 : 7));
  x.fillRect(0, -hh / 2, len * sc, hh); x.strokeRect(0, -hh / 2, len * sc, hh);
  x.restore();
  return c;
}
function group(title, rows) {
  const c = el('div', 'card'); c.appendChild(el('h2', null, title));
  rows.forEach(r => {
    const row = el('div', 'part-row');
    if (r.bar) row.appendChild(bar(r.bar[0], r.bar[1], r.cls));
    const pi = el('div', 'pi');
    pi.innerHTML = '<b>' + r.code + '</b>' + (r.qty > 1 ? '<span class="qchip">\u00D7' + r.qty + '</span>' : '') +
      '<div class="pd">' + r.d + '</div>';
    row.appendChild(pi);
    if (r.g) { const g = el('div'); g.appendChild(glyph(r.g[0], r.g[1])); row.appendChild(g); }
    c.appendChild(row);
  });
  s.appendChild(c);
}

  { code: 'FP1 / FP2', qty: 2, bar: [1390, [75, 50]], d: 'front corner posts \u00B7 S3 / S4', g: [75, 50] },

const note = el('div', 'card');

</script>
